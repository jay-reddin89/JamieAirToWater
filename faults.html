<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fault History | Jamie Air To Water</title><link rel="stylesheet" href="heat-pump-search.css"><link rel="stylesheet" href="service.css"><script src="source-registry.js" defer></script><script src="local-store.js" defer></script><script src="faults.js" defer></script></head><body><main><h1>Fault History</h1><a class="main-button" href="index.html">Home</a><p>Records are saved in this browser only. Export a backup before clearing site data or changing devices.</p><form id="fault-form"><input id="record-id" type="hidden"><label for="source">Brand / model</label><select id="source" required><option value="">Select a source</option></select><div class="columns"><div><label for="unit">Unit name</label><input id="unit" maxlength="200" placeholder="e.g. House outdoor unit"></div><div><label for="serial">Serial number (optional)</label><input id="serial" maxlength="200"></div></div><div class="columns"><div><label for="date">Observed date</label><input id="date" type="date" required></div><div><label for="fault-status">Status</label><select id="fault-status"><option value="open">Open</option><option value="resolved">Resolved</option></select></div></div><label for="code">Error code</label><input id="code" maxlength="100"><label for="symptoms">Symptoms</label><textarea id="symptoms" maxlength="10000"></textarea><label for="work-notes">Work notes / actions completed</label><textarea id="work-notes" maxlength="10000"></textarea><label for="resolution">Resolution</label><textarea id="resolution" maxlength="10000"></textarea><label for="resolved-on">Resolved date (if resolved)</label><input id="resolved-on" type="date"><div class="tools"><button id="save-fault" type="submit">Save fault</button><button id="cancel-edit" type="button">New record</button></div></form><p id="status" role="status" aria-live="polite"></p><div class="tools"><button id="export" type="button">Export backup</button><label class="file-button">Choose backup<input id="import-file" type="file" accept="application/json,.json"></label><button id="print" type="button">Report selected faults</button><button id="undo" type="button" hidden>Undo deletion</button></div><div id="import-preview" hidden><p id="import-summary"></p><button id="merge" type="button">Merge new records (keep existing IDs)</button><button id="cancel-import" type="button">Cancel import</button></div><div class="columns"><div><label for="filter">Filter status</label><select id="filter"><option value="all">All</option><option value="open">Open</option><option value="resolved">Resolved</option></select></div><div><label for="unit-filter">Filter unit / brand / code</label><input id="unit-filter" type="search"></div></div><div class="columns"><div><label for="from-date">From date</label><input id="from-date" type="date"></div><div><label for="to-date">To date</label><input id="to-date" type="date"></div></div><section id="fault-list" aria-label="Saved faults"></section></main></body></html>
